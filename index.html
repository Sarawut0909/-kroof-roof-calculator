<link rel="manifest" href="manifest.json"><title>K-Roof Calculator</title>
<style>
:root{--bg:#f4f1eb;--card:#fff;--ink:#151515;--muted:#746f67;--gold:#c99b3b;--gold2:#e2bf70;--line:#e5dfd4;--soft:#f8f6f1;--danger:#b33a32;--ok:#1d7a4d}*{box-sizing:border-box}html{background:#111}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#0d0d0d,#242424);color:#fff;padding:calc(15px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px #0004}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:-2px}.logo i{font-style:normal;color:#ffd66d}.brand b{font-size:22px}.brand small{display:block;color:#bbb;margin-top:1px;font-size:12px}.tabs{background:#191919;padding:9px 12px;display:flex;gap:7px;overflow-x:auto;position:sticky;top:76px;z-index:19;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;border:1px solid #555;background:#292929;color:#ddd;border-radius:13px;padding:10px 13px;font-weight:700;font-size:13px}.tabs button.active{background:var(--gold);color:#111;border-color:var(--gold)}main{max-width:980px;margin:auto;padding:14px 14px 90px}.panel{display:none}.panel.active{display:block}.hero{background:#111;color:#fff;border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 8px 24px #0001}.hero .ey{color:var(--gold2);font-weight:800;font-size:12px;text-transform:uppercase}.hero h1{margin:4px 0 4px;font-size:23px}.hero p{margin:0;color:#c9c9c9;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}.title{font-size:17px;font-weight:900;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#5e5a54;font-size:12px;font-weight:700;margin:0 0 6px}.field input{width:100%;height:50px;border:1px solid #cec8bd;border-radius:12px;padding:0 13px;font-size:18px;background:#fff;color:#111;outline:none}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c99b3b22}.unit{font-size:11px;color:#888;margin-top:4px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:var(--soft);border:1px solid #eee9e0;border-radius:13px;padding:12px}.metric small{color:#777;font-size:11px}.metric strong{display:block;font-size:23px;margin-top:3px}.metric.primary{background:#111;color:#fff;border-color:#111}.metric.primary small{color:#bbb}.metric.primary strong{color:#f4cc70}.summary{margin-top:10px;background:#111;color:#fff;border-radius:14px;padding:13px;font-size:15px;line-height:1.55}.summary b{color:#f1c768}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#111;color:#fff;font-weight:800}.btn.gold{background:var(--gold);color:#111}.btn.light{background:#eeeae2;color:#111}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.tbl{width:100%;min-width:670px;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{background:#f2eee7;color:#57524a}.tbl tr:last-child td{border-bottom:0}.recommended{margin-top:10px;padding:12px;border-radius:13px;background:#eef7f1;color:#165d3b;border:1px solid #cfe8d8;font-weight:800}.hint{font-size:12px;line-height:1.55;color:#777}.multi-head{display:grid;grid-template-columns:52px repeat(4,1fr);gap:7px;color:#777;font-size:10px;margin-bottom:5px}.multi-row{display:grid;grid-template-columns:52px repeat(4,1fr);gap:7px;margin-bottom:7px;align-items:center}.multi-row b{font-size:12px}.multi-row input{width:100%;height:44px;border:1px solid #cec8bd;border-radius:10px;padding:0 7px;font-size:15px}.mini-result{font-size:11px;color:#666;padding:3px 0 8px 59px}.install{background:#fff;border:1px dashed #b9b0a2}.install ol{margin:0;padding-left:22px;line-height:1.8;font-size:13px}.foot{text-align:center;color:#8a847a;font-size:11px;padding:8px 10px 35px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;border-radius:999px;padding:11px 17px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:650px){.grid{grid-template-columns:1fr}.multi-head,.multi-row{grid-template-columns:45px repeat(4,1fr)}.multi-row input{font-size:13px;padding:0 5px}.mini-result{padding-left:52px}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo"><i>K</i>R</div><div><b>K-Roof</b><small>Roof Calculator • สำหรับ iPad</small></div></div></header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main><div class="foot">K-Roof • โปรแกรมคำนวณแผ่นหลังคา</div><div class="toast" id="toast"></div>
<script>
const products={
 snow:{name:'VG SnowRoof',sub:'iR-uPVC • หน้ากว้าง 0.262 ม.',width:.262,lengths:[3,3.5,4,4.5,5,5.5,6,6.5],dw:4.5,dl:1.7},
 roofy:{name:'RoofyRoof',sub:'ไวนิล • หน้ากว้าง 0.25 ม.',width:.25,lengths:[4,5,6],dw:5,dl:2.7},
 glacia:{name:'VG Glacia Roof',sub:'หน้ากว้าง 0.334 ม.',width:.334,lengths:[3,3.5,4,4.5,5,5.5,6,6.5,7],dw:6,dl:2.9},
 jroof:{name:'JROOF / Mini Gold',sub:'แผ่นหน้ากว้าง 1.00 ม.',width:1,lengths:[3,4,5,6,8,9,10,11,12],dw:6,dl:5.8}
};
const tabs=[['snow','SnowRoof'],['roofy','RoofyRoof'],['glacia','VG Glacia'],['jroof','JROOF / MiniGold'],['multi','หลายส่วน'],['help','วิธีติดตั้ง']];
const tabsEl=document.getElementById('tabs'),app=document.getElementById('app');
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[1];b.onclick=()=>show(t[0]);if(i===0)b.className='active';tabsEl.appendChild(b)});
function show(id){document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',tabs[i][0]===id));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id)?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function num(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}function up(x){return Math.ceil(x)}function fmt(x,d=2){return Number.isFinite(x)?x.toLocaleString('th-TH',{maximumFractionDigits:d}):'-'}
function buildProduct(key){const p=products[key],el=document.createElement('section');el.id='p-'+key;el.className='panel'+(key==='snow'?' active':'');el.innerHTML=`<div class="hero"><div class="ey">K-ROOF CALCULATOR</div><h1>${p.name}</h1><p>${p.sub}</p></div><div class="card"><div class="title">ข้อมูลหน้างาน</div><div class="grid"><div class="field"><label>ความกว้างโครงหลังคา</label><input id="${key}-w" type="number" inputmode="decimal" step="0.01" value="${p.dw}"><div class="unit">เมตร</div></div><div class="field"><label>ระยะยื่น / ความยาวลาด</label><input id="${key}-l" type="number" inputmode="decimal" step="0.01" value="${p.dl}"><div class="unit">เมตร</div></div><div class="field"><label>หน้ากว้างแผ่น</label><input id="${key}-pw" type="number" inputmode="decimal" step="0.001" value="${p.width}"><div class="unit">เมตร</div></div></div><div class="actions"><button class="btn gold" onclick="calcProduct('${key}')">คำนวณ</button><button class="btn light" onclick="resetProduct('${key}')">รีเซ็ต</button></div></div><div class="card"><div class="title">ผลคำนวณ</div><div class="results"><div class="metric primary"><small>ชิ้นที่ต้องปูตามความกว้าง</small><strong id="${key}-pieces">-</strong></div><div class="metric"><small>ความยาวแผ่นที่พอดี</small><strong id="${key}-fit">-</strong></div><div class="metric"><small>จำนวนแนวตามความยาว</small><strong id="${key}-rows">-</strong></div><div class="metric"><small>แผ่นเต็มถ้าไม่ตัด</small><strong id="${key}-full">-</strong></div></div><div class="summary" id="${key}-summary">-</div></div><div class="card"><div class="title">วิเคราะห์การตัดและเศษ</div><div class="tablewrap"><table class="tbl"><thead><tr><th>แผ่นมาตรฐาน</th><th>ตัดได้/แผ่น</th><th>ใช้กี่แผ่น</th><th>ชิ้นที่ได้</th><th>เศษ/แผ่น</th><th>เศษรวม</th></tr></thead><tbody id="${key}-tbody"></tbody></table></div><div id="${key}-recommended" class="recommended">-</div></div>`;app.appendChild(el);['w','l','pw'].forEach(x=>document.getElementById(`${key}-${x}`).addEventListener('input',()=>calcProduct(key)));calcProduct(key)}
function calcProduct(key){const p=products[key],w=num(document.getElementById(key+'-w').value),l=num(document.getElementById(key+'-l').value),pw=num(document.getElementById(key+'-pw').value);if(w<=0||l<=0||pw<=0)return;const pieces=up(w/pw),fit=p.lengths.find(x=>x>=l),rows=fit?up(l/fit):null,full=fit?pieces*rows:null;document.getElementById(key+'-pieces').textContent=fmt(pieces,0);document.getElementById(key+'-fit').textContent=fit?fmt(fit,1):'เกิน '+Math.max(...p.lengths)+' ม.';document.getElementById(key+'-rows').textContent=rows??'-';document.getElementById(key+'-full').textContent=full??'-';const tb=document.getElementById(key+'-tbody');tb.innerHTML='';let best=null;p.lengths.forEach(len=>{const cut=len>=l?Math.floor(len/l):0,use=cut?up(pieces/cut):0,got=cut*use,scrap=cut?len-cut*l:0,total=use*scrap;if(cut){const waste=total*1000; if(!best||use<best.use||(use===best.use&&waste<best.waste))best={len,cut,use,got,scrap,total,waste}}const tr=document.createElement('tr');tr.innerHTML=`<td>${len.toFixed(1)} ม.</td><td>${cut||0}</td><td>${use||0}</td><td>${got||0}</td><td>${cut?fmt(scrap,2):'-'}</td><td>${cut?fmt(total,2):'-'}</td>`;tb.appendChild(tr)});const sum=document.getElementById(key+'-summary'),rec=document.getElementById(key+'-recommended');if(!fit){sum.innerHTML=`<b>⚠️ ความยาวเกินขนาดมาตรฐาน</b><br>สูงสุด ${Math.max(...p.lengths)} ม. ต้องแบ่งแนวหรือใช้วิธีต่อ`;rec.textContent='ต้องปรับความยาวลาดก่อนคำนวณ';return}sum.innerHTML=`ต้องใช้ <b>${fmt(pieces,0)} ชิ้น/แนว</b> × <b>${fmt(rows,0)} แนว</b> = <b>${fmt(full,0)} แผ่น</b> ถ้าใช้แผ่นเต็ม`;if(best){rec.innerHTML=`ชุดตัดที่แนะนำ: <b>${best.use} แผ่น × ${best.len.toFixed(1)} ม.</b> → ได้ ${best.got} ชิ้น | เศษรวม ${fmt(best.total,2)} ม.`}}
function resetProduct(key){const p=products[key];document.getElementById(key+'-w').value=p.dw;document.getElementById(key+'-l').value=p.dl;document.getElementById(key+'-pw').value=p.width;calcProduct(key);toast('รีเซ็ตค่าแล้ว')}
Object.keys(products).forEach(buildProduct);
function buildMulti(){const el=document.createElement('section');el.id='p-multi';el.className='panel';el.innerHTML=`<div class="hero"><div class="ey">CUSTOM CUT CALCULATOR</div><h1>คำนวณหลายส่วน</h1><p>ขนาดสินค้าไม่ตายตัว • หน่วยเซนติเมตร • คำนวณชิ้นเต็ม ชิ้นตัด และจำนวนที่ใช้จริง</p></div><div class="card"><div class="title">รายการหน้างาน</div><div class="multi-head"><span>ส่วน</span><span>กว้างโครง</span><span>ยาวโครง</span><span>กว้างสินค้า</span><span>ยาวสินค้า</span></div><div id="multiRows"></div><div class="actions"><button class="btn gold" onclick="addMulti()">+ เพิ่มส่วน</button><button class="btn light" onclick="clearMulti()">ล้างทั้งหมด</button></div></div><div class="card"><div class="title">สรุปรวม</div><div class="results"><div class="metric primary"><small>รวมชิ้นที่ใช้</small><strong id="mtotal">0</strong></div><div class="metric"><small>รวมแผ่นสต๊อก</small><strong id="mstock">0</strong></div><div class="metric"><small>เศษรวม</small><strong id="mscrap">0 ซม.</strong></div><div class="metric"><small>จำนวนส่วน</small><strong id="msections">0</strong></div></div><div class="summary" id="mnotes">กรอกข้อมูลเพื่อคำนวณ</div></div>`;app.appendChild(el);for(let i=0;i<6;i++)addMulti()}
let mcount=0;function addMulti(){mcount++;const box=document.createElement('div');box.className='multi-block';box.id='mr'+mcount;box.innerHTML=`<div class="multi-row"><b>${mcount}</b><input type="number" inputmode="decimal" placeholder="กว้าง" class="mw"><input type="number" inputmode="decimal" placeholder="ยาว" class="ml"><input type="number" inputmode="decimal" placeholder="กว้างสินค้า" class="mpw"><input type="number" inputmode="decimal" placeholder="ยาวสินค้า" class="mpl"></div><div class="mini-result" id="mres${mcount}">-</div>`;document.getElementById('multiRows').appendChild(box);box.querySelectorAll('input').forEach(x=>x.addEventListener('input',calcMulti))}
function clearMulti(){document.querySelectorAll('#multiRows input').forEach(x=>x.value='');calcMulti();toast('ล้างข้อมูลแล้ว')}
function calcMulti(){let total=0,stock=0,scrap=0,sections=0,notes=[];document.querySelectorAll('.multi-block').forEach((r,i)=>{const w=num(r.querySelector('.mw').value),l=num(r.querySelector('.ml').value),pw=num(r.querySelector('.mpw').value),pl=num(r.querySelector('.mpl').value),out=r.querySelector('.mini-result');if(!(w&&l&&pw&&pl)){out.textContent='-';return}sections++;const rows=up(l/pw),full=Math.floor(w/pl),rem=w%pl,cut=rem>0?1:0,used=rows*(full+cut);/* Excel logic: each row is a cut piece; stock count assumes each cut section needs a source piece. */const perCut=rem?Math.floor(pl/rem):0;const stockForFull=rows*full;const stockForCut=cut?Math.ceil(rows/(perCut||1)):0;const st=stockForFull+stockForCut;const usedLen=full*pl+rem;const sc=st*pl-usedLen*rows;total+=used;stock+=st;scrap+=Math.max(0,sc);out.innerHTML=`${rows} แนว × (${full} ชิ้นเต็ม${cut?' + 1 ชิ้นตัด':''}) = <b>${used} ชิ้น</b> • สต๊อก ${st} ชิ้น • เศษ ${fmt(Math.max(0,sc),0)} ซม.`;notes.push(`ส่วน ${i+1}: ${rows} แนว, ${full} ชิ้นเต็ม/แนว`+(cut?`, ชิ้นตัด ${fmt(rem,1)} ซม.`:''))});document.getElementById('mtotal').textContent=fmt(total,0);document.getElementById('mstock').textContent=fmt(stock,0);document.getElementById('mscrap').textContent=fmt(scrap,0)+' ซม.';document.getElementById('msections').textContent=sections;document.getElementById('mnotes').innerHTML=notes.length?notes.join('<br>'):'กรอกข้อมูลเพื่อคำนวณ'}
function buildHelp(){const el=document.createElement('section');el.id='p-help';el.className='panel';el.innerHTML=`<div class="hero"><div class="ey">K-ROOF APP</div><h1>ติดตั้งบน iPad</h1><p>ทำให้เปิดใช้งานเหมือนแอปได้ โดยไม่ต้องติดตั้งจาก App Store</p></div><div class="card install"><div class="title">วิธีเพิ่มไอคอน K-Roof บนหน้าจอ iPad</div><ol><li>เปิดเว็บไซต์ของ K-Roof ผ่าน <b>Safari</b></li><li>กดปุ่ม <b>แชร์</b> ที่แถบด้านบน</li><li>เลือก <b>เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)</b></li><li>กด <b>เพิ่ม (Add)</b></li><li>กลับหน้าจอ iPad จะมีไอคอน <b>K-Roof</b> และกดเปิดได้เหมือนแอป</li></ol></div><div class="card"><div class="title">การคำนวณ</div><div class="hint">รุ่นสินค้า 4 เมนูใช้หลักเดียวกับตาราง Excel ที่ให้มา: ปัดจำนวนชิ้นตามความกว้างขึ้น, เลือกความยาวมาตรฐานที่พอดี, คำนวณจำนวนแนว และวิเคราะห์การตัด/เศษของแต่ละความยาว ส่วน “หลายส่วน” ใช้หน่วยเซนติเมตรและคำนวณขนาดตัดตามแต่ละส่วน</div></div>`;app.appendChild(el)}buildMulti();buildHelp();
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
